<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Singapore PSI</title>
    <style>
        * {
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        body {
            background-color: #f7fbff;
            text-align: center;
            margin: 30px;
        }
        h1 {
            color: #0d47a1;
            margin-bottom: 4px;
        }
        .sub-title{
            color:#2168b7;
            font-size:18px;
            margin-bottom:20px;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 0 auto;
            box-shadow: 0 2px 10px rgba(0, 40, 90, 0.12);
        }
        th {
            background-color: #1565c0;
            color: white;
            padding: 11px;
            text-align: center;
        }
        td {
            border: 1px solid #bbdefb;
            padding:10px;
            text-align:center;
            transition: 0.2s;
        }
        tbody tr:nth-child(even) {
            background-color: #e8f2fe;
        }
        tbody tr:hover {
            background-color: #4299e1;
            color: white;
            cursor: pointer;
        }
        button {
            background-color: #1976d2;
            color:white;
            border:none;
            padding:9px 20px;
            border-radius:4px;
            font-size:15px;
            cursor:pointer;
            margin-bottom:15px;
        }
        button:hover{
            background-color:#0d47a1;
        }
        #metricDetail{
            width:90%;
            margin:16px auto 0;
            padding:14px;
            background:#e3f2fd;
            border-left:5px solid #1976d2;
            text-align:left;
            color:#0b3b70;
        }
        .time-text{
            color:#444;
            margin-bottom:12px;
        }
    </style>
</head>
<body>
    <h1>Pollutant Standards Index</h1>
    <div class="sub-title">Singapore</div>
    <div class="time-text">Last updated: <span id="time"></span></div>
    <button onclick="fetchData()">Refresh</button>
    <table>
        <thead>
            <tr>
                <th>Metric</th>
                <th>central</th>
                <th>west</th>
                <th>east</th>
                <th>north</th>
                <th>south</th>
            </tr>
        </thead>
        <tbody id="psiTableBody"></tbody>
    </table>
    <div id="metricDetail">Click any row in table to view metric description.</div>

<script>
const metricList = [
    "o3_sub_index",
    "pm10_twenty_four_hourly",
    "pm10_sub_index",
    "co_sub_index",
    "pm25_twenty_four_hourly",
    "so2_sub_index",
    "co_eight_hour_max",
    "no2_one_hour_max",
    "so2_twenty_four_hourly",
    "pm25_sub_index",
    "psi_twenty_four_hourly",
    "o3_eight_hour_max"
];

const metricInfo = {
  o3_sub_index: "O3 Sub-index: Ozone sub-index, indicating ozone pollution level.",
  pm10_twenty_four_hourly: "PM10 24-hourly: 24-hour average concentration of inhalable coarse particles.",
  pm10_sub_index: "PM10 Sub-index: Sub-index derived from PM10 concentration.",
  co_sub_index: "CO Sub-index: Carbon monoxide sub-index.",
  pm25_twenty_four_hourly: "PM2.5 24-hourly: 24-hour average concentration of fine particulate matter.",
  so2_sub_index: "SO2 Sub-index: Sulphur dioxide sub-index.",
  co_eight_hour_max: "CO 8-hour Max: 8-hour maximum carbon monoxide reading.",
  no2_one_hour_max: "NO2 1-hour Max: 1-hour maximum nitrogen dioxide reading.",
  so2_twenty_four_hourly: "SO2 24-hourly: 24-hour average sulphur dioxide concentration.",
  pm25_sub_index: "PM2.5 Sub-index: Sub-index derived from fine particle concentration.",
  psi_twenty_four_hourly: "PSI 24-hourly: Overall 24-hour Pollutant Standards Index for air quality.",
  o3_eight_hour_max: "O3 8-hour Max: 8-hour maximum ozone concentration."
};

async function fetchData(){
    const res = await fetch("https://api-open.data.gov.sg/v2/real-time/api/psi");
    const raw = await res.json();
    const reading = raw.data.items[0].readings;
    const timestamp = raw.data.items[0].timestamp;

    document.getElementById("time").innerText = timestamp;
    const tbody = document.getElementById("psiTableBody");
    tbody.innerHTML = "";

    metricList.forEach(name=>{
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${name}</td>
            <td>${reading[name].central}</td>
            <td>${reading[name].west}</td>
            <td>${reading[name].east}</td>
            <td>${reading[name].north}</td>
            <td>${reading[name].south}</td>
        `;
        row.onclick = ()=>{
            document.getElementById("metricDetail").innerText = metricInfo[name];
        }
        tbody.appendChild(row);
    })
}

fetchData();
</script>
</body>
</html>
